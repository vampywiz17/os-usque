name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils php-cli

      - name: Run portable validation
        run: make validate
